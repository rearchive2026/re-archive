<script>
  (function () {
    function initSitePlanLightbox() {
      var zoomButtons = document.querySelectorAll(".site-plan-zoom");

      if (!zoomButtons.length) {
        return;
      }

      var lightbox = document.createElement("div");
      var dialog = document.createElement("div");
      var image = document.createElement("img");
      var closeButton = document.createElement("button");
      var previousTrigger = null;

      lightbox.className = "site-plan-lightbox";
      lightbox.hidden = true;
      lightbox.setAttribute("role", "dialog");
      lightbox.setAttribute("aria-modal", "true");
      dialog.className = "site-plan-lightbox__dialog";
      image.className = "site-plan-lightbox__image";
      closeButton.className = "site-plan-lightbox__close";
      closeButton.type = "button";
      closeButton.setAttribute("aria-label", "닫기");
      closeButton.textContent = "×";

      dialog.appendChild(image);
      dialog.appendChild(closeButton);
      lightbox.appendChild(dialog);
      document.body.appendChild(lightbox);

      function openLightbox(trigger) {
        var sourceImage = trigger.querySelector("img");

        if (!sourceImage) {
          return;
        }

        previousTrigger = trigger;
        image.src = sourceImage.currentSrc || sourceImage.src;
        image.alt = sourceImage.alt || "";
        lightbox.hidden = false;
        lightbox.classList.add("is-open");
        document.body.style.overflow = "hidden";
        closeButton.focus();
      }

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightbox.hidden = true;
        image.removeAttribute("src");
        document.body.style.overflow = "";

        if (previousTrigger) {
          previousTrigger.focus();
        }
      }

      zoomButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          openLightbox(button);
        });
      });

      closeButton.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", function (event) {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });
      document.addEventListener("keydown", function (event) {
        if (!lightbox.hidden && event.key === "Escape") {
          closeLightbox();
        }
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initSitePlanLightbox);
    } else {
      initSitePlanLightbox();
    }
  })();

<script>
  (function () {
    function initNativeShare() {
      var shareButtons = document.querySelectorAll(".js-native-share");

      if (!shareButtons.length || !navigator.share) {
        return;
      }

      shareButtons.forEach(function (button) {
        button.hidden = false;

        button.addEventListener("click", function () {
          var canonical = document.querySelector('link[rel="canonical"]');
          var title = document.querySelector('meta[property="og:title"]');
          var description = document.querySelector('meta[property="og:description"]');
          var shareData = {
            title: title && title.content ? title.content : document.title,
            url: canonical && canonical.href ? canonical.href : window.location.href
          };

          if (description && description.content) {
            shareData.text = description.content;
          }

          navigator.share(shareData).catch(function (error) {
            if (!error || error.name === "AbortError") {
              return;
            }

            // 공유 실패는 기존 채널별 공유 버튼으로 대체할 수 있도록 조용히 기록합니다.
            console.warn("Native share failed", error);
          });
        });
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initNativeShare);
    } else {
      initNativeShare();
    }
  })();
</script>
<script>
  (function () {
    var mobileNavQuery = "(max-width: 1200px)";

    function restoreMobileNav() {
      if (window.matchMedia && !window.matchMedia(mobileNavQuery).matches) {
        return;
      }

      var nav = document.getElementById("site-nav");
      if (!nav) {
        return;
      }

      var visibleLinks = nav.querySelector(".visible-links");
      var hiddenLinks = nav.querySelector(".hidden-links");
      var toggle = nav.querySelector(".greedy-nav__toggle");

      if (!visibleLinks || !hiddenLinks) {
        return;
      }

      while (hiddenLinks.firstElementChild) {
        visibleLinks.appendChild(hiddenLinks.firstElementChild);
      }

      visibleLinks.classList.remove("hidden");
      hiddenLinks.classList.add("hidden");

      if (toggle) {
        toggle.classList.add("hidden");
        toggle.classList.remove("close");
        toggle.setAttribute("aria-hidden", "true");
      }
    }

    function scheduleRestore() {
      restoreMobileNav();
      window.setTimeout(restoreMobileNav, 0);
      window.setTimeout(restoreMobileNav, 120);
      window.setTimeout(restoreMobileNav, 500);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", scheduleRestore);
    } else {
      scheduleRestore();
    }

    window.addEventListener("load", scheduleRestore);
    window.addEventListener("resize", scheduleRestore);
  })();
</script>
